<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Rewards Panel</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Web3Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@latest/dist/index.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-white shadow">
    <div class="px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-2">
          <i data-lucide="leaf" class="h-8 w-8 text-green-600"></i>
          <div class="flex flex-col leading-none">
            <span class="font-bold text-lg">SaveForFuture</span>
            <span class="text-xs text-gray-500">SaveForYou</span>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-4">
        <button class="relative">
          <i data-lucide="bell" class="w-6 h-6"></i>
          <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">3</span>
        </button>

        <button onclick="logout()" class="bg-green-600 hover:bg-green-700 text-white py-2 px-6 rounded-full transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="bg-white border-r pt-20 border-gray-200 text-gray-800 w-64 fixed inset-y-0 left-0 z-30">
    <nav class="h-full flex flex-col justify-between">
      <div class="px-4 py-6 space-y-4">
        <a href="adminhome.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="home" class="mr-3 h-4 w-4"></i>
          <span>Home</span>
        </a>
        <a href="admin.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="truck" class="mr-3 h-4 w-4"></i>
          <span>Collect Waste</span>
        </a>
        <a href="adminreward.html" class="flex items-center py-3 px-4 rounded-md bg-green-100 text-green-800">
          <i data-lucide="coins" class="mr-3 h-4 w-4"></i>
          <span>Rewards</span>
        </a>
        <a href="adminleaderboard.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="star" class="mr-3 h-4 w-4"></i>
          <span>Leaderboard</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 pt-24 px-8">
    <h2 class="text-2xl font-semibold text-center mb-6">Admin Rewards Panel</h2>

    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded shadow border">
        <thead>
          <tr class="bg-green-600 text-white">
            <th class="py-3 px-4 text-left">Username</th>
            <th class="py-3 px-4 text-left">Points</th>
            <th class="py-3 px-4 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="rewardTableBody">
          <!-- Dynamic content goes here -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function fetchRewards() {
      try {
        const response = await fetch('http://127.0.0.1:5000/reward-list');
        const data = await response.json();
        const tableBody = document.getElementById('rewardTableBody');
        tableBody.innerHTML = '';

        data.rewards.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="py-2 px-4">${user.userName}</td>
            <td class="py-2 px-4">${user.points}</td>
            <td class="py-2 px-4 space-x-2">
              <button class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded" onclick="modifyReward('${user.userName}', 50)">Add 50</button>
              <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded" onclick="modifyReward('${user.userName}', -50)">Remove 50</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Error fetching rewards:', error);
      }
    }

    async function modifyReward(username, points) {
      const url = points > 0 ? 'http://127.0.0.1:5000/add-reward' : 'http://127.0.0.1:5000/remove-reward';
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, points: Math.abs(points) })
        });
        const result = await response.json();
        alert(result.message || 'Action completed');
        fetchRewards();
      } catch (error) {
        console.error('Reward update failed:', error);
      }
    }

    function logout() {
      const confirmLogout = confirm("Do you want to logout from this account?");
      if (confirmLogout) {
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = 'welcome.html';
      }
    }

    // Init
    window.onload = function () {
      fetchRewards();
      lucide.createIcons();
    };
  </script>
</body>
</html>
