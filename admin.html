<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel - Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS & Lucide Icons -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Web3Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@latest/dist/index.min.js"></script>

  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
    }
    th {
      background-color: green;
      color: white;
      padding: 8px;
    }
    td {
      padding: 8px;
      border: 1px solid #ddd;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
      margin-right: 5px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      background-color: #ccc;
      border-radius: 34px;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: 0.4s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }
    input:checked + .slider {
      background-color: green;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body class="font-sans bg-gray-100">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-white shadow">
    <div class="px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-2">
          <i data-lucide="leaf" class="h-8 w-8 text-green-600"></i>
          <div class="flex flex-col leading-none">
            <span class="font-bold text-lg">SaveForFuture</span>
            <span class="text-xs text-gray-500">SaveForYou</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-4">
        <button class="relative">
          <svg class="icon w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 22c1.1 0 1.99-.9 1.99-2H10c0 1.1.89 2 1.99 2zM18 16V8c0-3.31-2.69-6-6-6s-6 2.69-6 6v8l-2 2v1h16v-1l-2-2z"></path>
          </svg>
          <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">3</span>
        </button>
        <button onclick="logout()" class="bg-green-600 hover:bg-green-700 text-white py-2 px-6 rounded-full transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="bg-white border-r pt-20 border-gray-200 text-gray-800 w-64 fixed inset-y-0 left-0 z-30">
    <nav class="h-full flex flex-col justify-between">
      <div class="px-4 py-6 space-y-4">
        <a href="adminhome.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="home" class="mr-3 h-4 w-4"></i>
          <span>Home</span>
        </a>
        <a href="admin.html" class="flex items-center py-3 px-4 rounded-md bg-green-100 text-green-800">
          <i data-lucide="truck" class="mr-3 h-4 w-4"></i>
          <span>Collect Waste</span>
        </a>
        <a href="adminreward.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="coins" class="mr-3 h-4 w-4"></i>
          <span>Rewards</span>
        </a>
        <a href="adminleaderboard.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="star" class="mr-3 h-4 w-4"></i>
          <span>Leaderboard</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="pl-64 pt-28 px-4">
    <h1 class="text-2xl font-bold mb-6 text-center">📋 Reports Status</h1>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Waste Type</th>
          <th>KG</th>
          <th>location</th>
          <th>Verification</th>
          <th>Collection</th>
        </tr>
      </thead>
      <tbody id="reports-table-body"></tbody>
    </table>
  </main>

  <script>
    lucide.createIcons();

    async function updateToggle(userId, wasteType, amount, field, value) {
      await fetch('http://localhost:5000/update-toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, wasteType, amount, field, value })
      });
    }

    async function fetchReports() {
      try {
        const response = await fetch('http://localhost:5000/recent-reports');
        const data = await response.json();
        const tbody = document.getElementById('reports-table-body');
        tbody.innerHTML = '';

        for (const [index, report] of data.reports.entries()) {
          const userId = report.userId;
          const username = report.userName || userId || `User-${index}`;
          const uniqueKey = `${userId}-${report.wasteType}-${report.amount}`;
          const verifyId = `verifySwitch-${uniqueKey}`;
          const collectId = `collectSwitch-${uniqueKey}`;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${username}</td>
            <td>${report.wasteType}</td>
            <td>${report.amount}</td>
            <td>${report.location}</td>
            <td>
              <label class="switch">
                <input type="checkbox" id="${verifyId}">
                <span class="slider"></span>
              </label>
              <span id="${verifyId}-label">Loading...</span>
            </td>
            <td>
              <label class="switch">
                <input type="checkbox" id="${collectId}">
                <span class="slider"></span>
              </label>
              <span id="${collectId}-label">Loading...</span>
            </td>
          `;
          tbody.appendChild(row);

          const verifySwitch = document.getElementById(verifyId);
          const collectSwitch = document.getElementById(collectId);

          const stateRes = await fetch(`http://localhost:5000/get-toggle-state?userId=${userId}&wasteType=${report.wasteType}&amount=${report.amount}`);
          const state = await stateRes.json();

          const verified = state.verified;
          const collected = state.collected;
          verifySwitch.checked = verified;
          collectSwitch.checked = collected;

          document.getElementById(`${verifyId}-label`).textContent = verified ? 'Verified' : 'Not Verified';
          document.getElementById(`${collectId}-label`).textContent = collected ? 'Collected' : 'Not Collected';

          let rewarded = verified && collected;

          async function updateAndReward() {
            const newVerified = verifySwitch.checked;
            const newCollected = collectSwitch.checked;

            document.getElementById(`${verifyId}-label`).textContent = newVerified ? 'Verified' : 'Not Verified';
            document.getElementById(`${collectId}-label`).textContent = newCollected ? 'Collected' : 'Not Collected';

            await updateToggle(userId, report.wasteType, report.amount, 'is_verified', newVerified);
            await updateToggle(userId, report.wasteType, report.amount, 'is_collected', newCollected);

            if (newVerified && newCollected && !rewarded) {
              await fetch('http://localhost:5000/add-reward', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: userId,
                  points: 50,
                  description: 'Report completed and verified'
                })
              });
              rewarded = true;
            }

            if (!newVerified || !newCollected) {
              await fetch('http://localhost:5000/remove-reward', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userId })
              });
              rewarded = false;
            }
          }

          verifySwitch.addEventListener('change', updateAndReward);
          collectSwitch.addEventListener('change', updateAndReward);
        }
      } catch (err) {
        console.error('Failed to fetch reports:', err);
      }
    }

    function logout() {
      const confirmLogout = confirm("Do you want to logout from this account?");
      if (confirmLogout) {
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = 'welcome.html';
      }
    }

    window.onload = fetchReports;
  </script>
</body>
</html>
