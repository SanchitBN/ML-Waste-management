<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Waste</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="report.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script>
  <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@latest/dist/index.min.js"></script>
  <link rel="stylesheet" href="header.css">
</head>
<body class="font-sans bg-gray-100">

  <!-- Header -->
  <header class="header fixed top-0 left-0 right-0 z-40 bg-white shadow">
    <div class="header-content px-4 py-2 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a class="flex items-center gap-2">
          <i data-lucide="leaf" class="h-8 w-8 text-green-600"></i>
          <div class="flex flex-col leading-none">
            <span class="font-bold text-lg">SaveForFuture</span>
            <span class="text-xs text-gray-500">SaveForYou</span>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-4">
        <button class="relative bell-btn">
          <svg class="icon w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 22c1.1 0 1.99-.9 1.99-2H10c0 1.1.89 2 1.99 2zM18 16V8c0-3.31-2.69-6-6-6s-6 2.69-6 6v8l-2 2v1h16v-1l-2-2z"></path>
          </svg>
          <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">3</span>
        </button>

        <button onclick="logout()" class="bg-green-600 hover:bg-green-700 text-white py-2 px-6 rounded-full transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="bg-white border-r pt-20 border-gray-200 text-gray-800 w-64 fixed inset-y-0 left-0 z-30">
    <nav class="h-full flex flex-col justify-between">
      <div class="px-4 py-6 space-y-4">
        <a href="home.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="home" class="mr-3 h-4 w-4"></i>
          <span>Home</span>
        </a>
        <a href="report.html" class="flex items-center py-3 px-4 rounded-md bg-green-100 text-green-800">
          <i data-lucide="map-pin" class="mr-3 h-4 w-4"></i>
          <span>Report Waste</span>
        </a>
        <a href="reward.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="coins" class="mr-3 h-4 w-4"></i>
          <span>Rewards</span>
        </a>
        <a href="leaderboard.html" class="flex items-center py-3 px-4 rounded-md text-gray-600 hover:bg-gray-100">
          <i data-lucide="star" class="mr-3 h-4 w-4"></i>
          <span>Leaderboard</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="pt-24 pl-72 pr-6 pb-12 min-h-screen bg-gray-100">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
      <h1 class="text-2xl font-semibold mb-4 text-gray-800">Report Waste</h1>

      <form id="reportForm" class="space-y-6">
        <div>
          <label for="waste-image" class="block font-medium text-gray-700 mb-1">Upload Waste Image</label>
          <input type="file" id="waste-image" accept="image/*" class="w-full border rounded p-2">
        </div>

        <div id="preview-container" class="mb-4"></div>

        <button type="button" id="verifyButton" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Verify Waste</button>

        <div id="verificationResult" class="text-sm text-gray-700"></div>

        <div>
          <label for="location" class="block font-medium text-gray-700 mb-1">Location</label>
          <input type="text" id="location" required class="w-full border rounded p-2">
        </div>

        <div>
          <label for="type" class="block font-medium text-gray-700 mb-1">Waste Type</label>
          <input type="text" id="type" readonly class="w-full border rounded p-2 bg-gray-100">
        </div>

        <div>
          <label for="amount" class="block font-medium text-gray-700 mb-1">Estimated Amount</label>
          <input type="text" id="amount" readonly class="w-full border rounded p-2 bg-gray-100">
        </div>

        <button type="submit" id="submitButton" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Submit Report</button>
      </form>
    </div>

    <div id="recentReports" class="mt-8"></div>
  </main>

  <script src="report.js"></script>

  <script>
    lucide.createIcons();

    async function fetchImpactData() {
      try {
        const res = await fetch('/api/impact');
        const data = await res.json();
        document.getElementById('wasteCollected').textContent = `${data.wasteCollected} kg`;
        document.getElementById('reportsSubmitted').textContent = data.reportsSubmitted;
        document.getElementById('tokensEarned').textContent = data.tokensEarned;
        document.getElementById('co2Offset').textContent = `${data.co2Offset} kg`;
      } catch (err) {
        console.error('Failed to fetch data:', err);
      }
    }

    document.getElementById('startBtn')?.addEventListener('click', () => {
      window.location.href = 'report.html';
    });

    fetchImpactData();

    function logout() {
      const confirmLogout = confirm("Do you want to logout from this account?");
      if (confirmLogout) {
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = 'welcome.html';
      }
    }
  </script>

</body>
</html>
